<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Latihan Web01</title>
</head>

<body>
    <div
        style="width: 350px; height: 225px;  overflow-y: scroll; overflow-x: hidden; border: thin #000 solid; padding: 5px;">
        <form>
            <div style="display: flex; align-items: center; gap: 25px;margin-bottom: 15px;">

                <label for="nama">Name:</label>
                <input type="text" id="nama" name="nama" size="30" placeholder="your name here"><br>
            </div>
            <div style="display: flex; align-items: center; gap: 25px; margin-bottom: 15px;">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" size="30" placeholder="your email here"><br>
            </div>
            <div style=" display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <label for="alamat">Address: </label>

                <textarea id="address" name="address" style="width: 200px; height: 75px; resize: none;" placeholder="25 Nowhere Street
Somewhere
Not Here
Y2K 5RU"></textarea>
            </div>

            <label for="kodepos">Postcode:</label>
            <input type="text" id="kodepos" name="kodepos" size="20" placeholder="postal code">


        </form>
    </div>
</body>

</html>
